<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Login - PSO3</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Login</h1>
        
        <div id="error-message" class="hidden mb-4 text-red-600 p-4 bg-red-50 rounded text-center"></div>
        
        <form id="loginForm" method="post" action="/login" class="space-y-4" onsubmit="return handleSubmit(event)">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    required 
                    autocomplete="email"
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                >
            </div>
            
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Senha</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    required 
                    autocomplete="current-password"
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                >
            </div>

            <button 
                type="submit"
                class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
            >
                Entrar
            </button>
        </form>

        <p class="mt-4 text-center text-sm text-gray-600">
            Não tem conta? 
            <a href="/cadastro" class="font-medium text-blue-600 hover:text-blue-500">
                Cadastre-se
            </a>
        </p>
    </div>

    <script>
        function handleSubmit(event) {
            event.preventDefault();
            const form = event.target;
            const submitButton = form.querySelector('button[type="submit"]');
            submitButton.disabled = true;
            
            fetch(form.action, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams(new FormData(form)),
                redirect: 'follow'
            })
            .then(response => {
                if (response.redirected) {
                    window.location.href = response.url;
                } else if (!response.ok) {
                    throw new Error('Login failed');
                }
            })
            .catch(error => {
                const errorDiv = document.getElementById('error-message');
                errorDiv.textContent = 'Erro ao fazer login. Por favor, tente novamente.';
                errorDiv.classList.remove('hidden');
                submitButton.disabled = false;
            });
            
            return false;
        }

        // Handle error messages from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        const errorDiv = document.getElementById('error-message');
        
        if (error) {
            const messages = {
                'session_expired': 'Sua sessão expirou. Por favor, faça login novamente.',
                'expired': 'Sua sessão expirou. Por favor, faça login novamente.',
                'unauthorized': 'Acesso não autorizado. Por favor, faça login.',
                'credentials': 'Email ou senha inválidos. Por favor, tente novamente.',
                'token': 'Erro ao gerar token. Por favor, tente novamente.'
            };
            
            const message = messages[error] || 'Ocorreu um erro. Por favor, tente novamente.';
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
