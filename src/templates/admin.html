<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administração - PSO3</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <h1 class="text-xl font-semibold">PSO3 Admin</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/chat" class="text-gray-600 hover:text-gray-900">Chat</a>
                    <a href="/logout" class="text-gray-600 hover:text-gray-900">Sair</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Empresas Section -->
        <div class="bg-white shadow-lg rounded-lg p-6 mb-8">
            <h2 class="text-2xl font-semibold mb-6">Gerenciar Empresas</h2>
            
            <!-- Add Company Form -->
            <form id="empresa-form" class="mb-8 space-y-4">
                <div>
                    <label for="nome" class="block text-sm font-medium text-gray-700">Nome da Empresa</label>
                    <input 
                        type="text" 
                        id="nome-empresa" 
                        name="nome" 
                        required 
                        maxlength="100"
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                    >
                </div>
                
                <div>
                    <label for="cnpj" class="block text-sm font-medium text-gray-700">CNPJ</label>
                    <input 
                        type="text" 
                        id="cnpj" 
                        name="cnpj" 
                        required 
                        pattern="\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}"
                        placeholder="00.000.000/0000-00"
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                    >
                </div>

                <button 
                    type="submit"
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
                >
                    Cadastrar Empresa
                </button>
            </form>

            <!-- Companies List -->
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nome</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">CNPJ</th>
                            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="empresas-list" class="bg-white divide-y divide-gray-200">
                        <!-- Companies will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Users Section -->
        <div class="bg-white shadow-lg rounded-lg p-6">
            <h2 class="text-2xl font-semibold mb-6">Usuários</h2>

            <!-- Users List -->
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nome</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Categoria</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Empresa</th>
                            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="usuarios-list" class="bg-white divide-y divide-gray-200">
                        <!-- Users will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Format CNPJ input
        document.getElementById('cnpj').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length <= 14) {
                value = value.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5');
                e.target.value = value;
            }
        });

        // Load companies
        async function loadEmpresas() {
            try {
                const response = await fetch('/admin/empresas');
                const empresas = await response.json();
                document.getElementById('empresas-list').innerHTML = empresas.map(empresa => `
                    <tr>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${empresa.nome}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${empresa.cnpj}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <button 
                                onclick="deleteEmpresa('${empresa.id}')"
                                class="text-red-600 hover:text-red-900"
                            >
                                Excluir
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Error loading companies:', error);
            }
        }

        // Load users
        async function loadUsuarios() {
            try {
                const response = await fetch('/admin/usuarios');
                const usuarios = await response.json();
                document.getElementById('usuarios-list').innerHTML = usuarios.map(usuario => `
                    <tr>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${usuario.nome}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${usuario.email}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${usuario.categoria}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${usuario.empresa || '-'}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <button 
                                onclick="deleteUsuario('${usuario.id}')"
                                class="text-red-600 hover:text-red-900"
                            >
                                Excluir
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Error loading users:', error);
            }
        }

        // Handle company form submission
        document.getElementById('empresa-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = {
                nome: document.getElementById('nome-empresa').value,
                cnpj: document.getElementById('cnpj').value
            };

            try {
                const response = await fetch('/admin/empresas', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    document.getElementById('empresa-form').reset();
                    loadEmpresas();
                } else {
                    const error = await response.text();
                    alert(error);
                }
            } catch (error) {
                console.error('Error creating company:', error);
                alert('Erro ao cadastrar empresa');
            }
        });

        // Delete company
        async function deleteEmpresa(id) {
            if (!confirm('Tem certeza que deseja excluir esta empresa?')) {
                return;
            }

            try {
                const response = await fetch(`/admin/empresas/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    loadEmpresas();
                } else {
                    const error = await response.text();
                    alert(error);
                }
            } catch (error) {
                console.error('Error deleting company:', error);
                alert('Erro ao excluir empresa');
            }
        }

        // Delete user
        async function deleteUsuario(id) {
            if (!confirm('Tem certeza que deseja excluir este usuário?')) {
                return;
            }

            try {
                const response = await fetch(`/admin/usuarios/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    loadUsuarios();
                } else {
                    const error = await response.text();
                    alert(error);
                }
            } catch (error) {
                console.error('Error deleting user:', error);
                alert('Erro ao excluir usuário');
            }
        }

        // Load data on page load
        loadEmpresas();
        loadUsuarios();
    </script>
</body>
</html>
