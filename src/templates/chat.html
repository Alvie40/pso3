<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - PSO3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 500px;
            border-radius: 8px;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Adicionar o modal no início do body -->
    <div id="sessionExpiredModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-xl">
            <h2 class="text-xl font-bold mb-4">Sessão Expirada</h2>
            <p class="mb-6">Sua sessão expirou. Por favor, faça login novamente para continuar.</p>
            <button onclick="window.location.href='/login'" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                Fazer Login
            </button>
        </div>
    </div>

    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <h1 class="text-xl font-semibold">PSO3 Chat</h1>
                </div>
                <div class="flex items-center">
                    <a href="/logout" class="text-gray-600 hover:text-gray-900">Sair</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="bg-white shadow-lg rounded-lg p-6">
            <h2 class="text-lg font-semibold mb-4">Enviar Mensagem</h2>
            <form id="messageForm" class="space-y-4">
                <div>
                    <label for="to" class="block text-sm font-medium text-gray-700">Número do WhatsApp</label>
                    <input 
                        type="tel" 
                        id="to" 
                        name="to" 
                        required 
                        pattern="\+?[1-9]\d{1,14}"
                        placeholder="+5511999999999"
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                    >
                </div>
                
                <div>
                    <label for="message" class="block text-sm font-medium text-gray-700">Mensagem</label>
                    <textarea 
                        id="message" 
                        name="message" 
                        required 
                        rows="4"
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                    ></textarea>
                </div>

                <button 
                    type="submit"
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
                >
                    Enviar
                </button>
            </form>
        </div>

        <div class="mt-8 bg-white shadow-lg rounded-lg p-6">
            <h2 class="text-lg font-semibold mb-4">Histórico de Mensagens</h2>
            <div id="messages" class="space-y-4">
                <!-- Messages will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Modal de sessão expirada -->
    <div id="sessionModal" class="modal">
        <div class="modal-content">
            <h2 class="text-xl font-bold mb-4">Sessão Expirada</h2>
            <p class="mb-4">Sua sessão expirou. Por favor, faça login novamente para continuar.</p>
            <button onclick="redirectToLogin()" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                Fazer Login
            </button>
        </div>
    </div>

    <script>
        // Format phone number input
        document.getElementById('to').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.startsWith('55')) {
                value = '+' + value;
            } else if (value) {
                value = '+55' + value;
            }
            e.target.value = value;
        });

        function showSessionExpiredModal() {
            const modal = document.getElementById('sessionExpiredModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function redirectToLogin() {
            window.location.href = '/login';
        }

        // Função para verificar a validade do token
        async function checkSession() {
            const token = document.cookie.split('; ').find(row => row.startsWith('token='))?.split('=')[1];
            
            if (!token) {
                showSessionExpiredModal();
                return false;
            }

            try {
                const response = await fetch('/me', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    if (response.status === 401) {
                        showSessionExpiredModal();
                        return false;
                    }
                }
                return true;
            } catch (error) {
                console.error('Error checking session:', error);
                return false;
            }
        }

        // Handle form submission
        document.getElementById('messageForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!await checkSession()) {
                return;
            }

            const to = document.getElementById('to').value;
            const message = document.getElementById('message').value;
            
            try {
                const response = await fetch('/api/whatsapp', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ to, message })
                });

                if (!response.ok) {
                    if (response.status === 401) {
                        showSessionExpiredModal();
                        return;
                    }
                    throw new Error('Erro ao enviar mensagem');
                }

                // Limpa o formulário
                document.getElementById('message').value = '';
                
                // Recarrega as mensagens
                loadMessages();

                // Feedback visual
                alert('Mensagem enviada com sucesso!');
            } catch (error) {
                console.error('Error sending message:', error);
                alert('Erro ao enviar mensagem: ' + error.message);
            }
        });

        // Load messages
        async function loadMessages() {
            if (!await checkSession()) {
                return;
            }

            try {
                const token = document.cookie.split('; ').find(row => row.startsWith('token='))?.split('=')[1];
                
                if (!token) {
                    showSessionExpiredModal();
                    return;
                }

                const response = await fetch('/mensagens', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!response.ok) {
                    if (response.status === 401) {
                        showSessionExpiredModal();
                        return;
                    }
                    throw new Error('Erro ao carregar mensagens');
                }

                const messages = await response.json();
                const messagesDiv = document.getElementById('messages');
                messagesDiv.innerHTML = messages.map(msg => `
                    <div class="p-4 ${msg.recebido ? 'bg-blue-50' : 'bg-gray-50'} rounded-lg">
                        <p class="text-sm text-gray-600">${new Date(msg.criado_em).toLocaleString()}</p>
                        <p class="mt-1">${msg.texto}</p>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading messages:', error);
            }
        }

        // Verificar sessão a cada 5 minutos
        setInterval(checkSession, 300000);

        // Load messages on page load
        loadMessages();

        // Reload messages every 30 seconds
        setInterval(loadMessages, 30000);
    </script>
</body>
</html>
