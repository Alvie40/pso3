<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Chat - PSO3</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <h1 class="text-xl font-semibold">PSO3 Chat</h1>
                </div>
                <div class="flex items-center">
                    <button onclick="logout()" class="text-gray-600 hover:text-gray-900">Sair</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="bg-white shadow-lg rounded-lg p-6">
            <h2 class="text-lg font-semibold mb-4">Enviar Mensagem</h2>
            <form id="messageForm" class="space-y-4">
                <div>
                    <label for="to" class="block text-sm font-medium text-gray-700">Número do WhatsApp</label>
                    <input 
                        type="tel" 
                        id="to" 
                        name="to" 
                        required 
                        pattern="\+?[1-9]\d{1,14}"
                        placeholder="+5511999999999"
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                    >
                </div>
                
                <div>
                    <label for="message" class="block text-sm font-medium text-gray-700">Mensagem</label>
                    <textarea 
                        id="message" 
                        name="message" 
                        required 
                        rows="4"
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                    ></textarea>
                </div>

                <button 
                    type="submit"
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
                >
                    Enviar
                </button>
            </form>
        </div>

        <div class="mt-8 bg-white shadow-lg rounded-lg p-6">
            <h2 class="text-lg font-semibold mb-4">Histórico de Mensagens</h2>
            <div id="messages" class="space-y-4">
                <!-- Messages will be loaded here -->
            </div>
        </div>
    </div>

    <script>
        // Format phone number input
        document.getElementById('to').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.startsWith('55')) {
                value = '+' + value;
            } else if (value) {
                value = '+55' + value;
            }
            e.target.value = value;
        });

        async function checkSession() {
            try {
                const response = await fetch('/auth/me', {
                    credentials: 'include',
                    cache: 'no-store',
                    headers: {
                        'Cache-Control': 'no-cache, no-store, must-revalidate',
                        'Pragma': 'no-cache'
                    }
                });

                if (response.status === 401) {
                    window.location.href = '/login?error=session_expired';
                    return false;
                }

                if (!response.ok) {
                    console.warn('Session check returned unexpected status:', response.status);
                    return true; // Don't redirect on non-401 errors
                }

                const data = await response.json();
                return true;
            } catch (error) {
                console.error('Error checking session:', error);
                return true; // Don't redirect on network errors
            }
        }

        async function logout() {
            try {
                await fetch('/auth/logout', {
                    method: 'GET',
                    credentials: 'include'
                });
                window.location.href = '/login';
            } catch (error) {
                console.error('Error logging out:', error);
                window.location.href = '/login';
            }
        }

        // Handle form submission
        document.getElementById('messageForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!await checkSession()) {
                return;
            }

            const submitButton = e.target.querySelector('button[type="submit"]');
            submitButton.disabled = true;
            
            try {
                const token = document.cookie
                    .split('; ')
                    .find(row => row.startsWith('token='))
                    ?.split('=')[1];

                const formData = new FormData(e.target);
                const response = await fetch('/api/whatsapp', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': token ? `Bearer ${token}` : '',
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        to: formData.get('to'),
                        message: formData.get('message')
                    })
                });

                if (!response.ok) {
                    if (response.status === 401) {
                        window.location.href = '/login?error=session_expired';
                        return;
                    }
                    throw new Error('Erro ao enviar mensagem');
                }

                // Clear the form
                e.target.reset();
                
                // Reload messages
                loadMessages();

                // Show success message
                alert('Mensagem enviada com sucesso!');
            } catch (error) {
                console.error('Error sending message:', error);
                alert('Erro ao enviar mensagem: ' + error.message);
            } finally {
                submitButton.disabled = false;
            }
        });

        // Load messages
        async function loadMessages() {
            try {
                // Get token from cookie
                const token = document.cookie
                    .split('; ')
                    .find(row => row.startsWith('token='))
                    ?.split('=')[1];

                const response = await fetch('/api/messages', {
                    credentials: 'include',
                    headers: {
                        'Authorization': token ? `Bearer ${token}` : '',
                        'Cache-Control': 'no-cache',
                        'Pragma': 'no-cache'
                    }
                });
                
                if (!response.ok) {
                    if (response.status === 401) {
                        window.location.href = '/login?error=session_expired';
                        return;
                    }
                    throw new Error('Erro ao carregar mensagens');
                }

                const messages = await response.json();
                const messagesDiv = document.getElementById('messages');
                messagesDiv.innerHTML = messages.map(msg => `
                    <div class="p-4 ${msg.recebido ? 'bg-blue-50' : 'bg-gray-50'} rounded-lg">
                        <p class="text-sm text-gray-600">${new Date(msg.criado_em).toLocaleString()}</p>
                        <p class="mt-1">${msg.texto}</p>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading messages:', error);
            }
        }

        // Initial session check and load messages
        (async function init() {
            if (await checkSession()) {
                loadMessages();
                // Set up periodic session checks
                setInterval(checkSession, 60000); // Check session every minute
                // Set up periodic message updates
                setInterval(loadMessages, 30000); // Update messages every 30 seconds
            }
        })();
    </script>
</body>
</html>
