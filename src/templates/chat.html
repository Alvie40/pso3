<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Chat - PSO3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .message {
            margin: 10px;
            padding: 10px;
            border-radius: 5px;
        }
        .sent {
            background-color: #e3f2fd;
            margin-left: 20%;
        }
        .received {
            background-color: #f5f5f5;
            margin-right: 20%;
        }
        #messages {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
        }
        #messageForm {
            display: flex;
            gap: 10px;
        }
        #messageInput {
            flex-grow: 1;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <h1 class="text-xl font-semibold">PSO3 Chat</h1>
                </div>
                <div class="flex items-center">
                    <button onclick="logout()" class="text-gray-600 hover:text-gray-900">Sair</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="bg-white shadow-lg rounded-lg p-6">
            <h2 class="text-lg font-semibold mb-4">Enviar Mensagem</h2>
            <div id="messages"></div>
            <form id="messageForm">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="Digite sua mensagem..." 
                    required 
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                >
                <button 
                    type="submit"
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
                >
                    Enviar
                </button>
            </form>
        </div>
    </div>

    <script>
        async function checkSession() {
            try {
                const response = await fetch('/auth/me', {
                    credentials: 'include',
                    cache: 'no-store',
                    headers: {
                        'Cache-Control': 'no-cache, no-store, must-revalidate',
                        'Pragma': 'no-cache'
                    }
                });

                if (response.status === 401) {
                    window.location.href = '/login?error=session_expired';
                    return false;
                }

                if (!response.ok) {
                    console.warn('Session check returned unexpected status:', response.status);
                    return true; // Don't redirect on non-401 errors
                }

                const data = await response.json();
                return true;
            } catch (error) {
                console.error('Error checking session:', error);
                return true; // Don't redirect on network errors
            }
        }

        async function logout() {
            try {
                await fetch('/auth/logout', {
                    method: 'GET',
                    credentials: 'include'
                });
                window.location.href = '/login';
            } catch (error) {
                console.error('Error logging out:', error);
                window.location.href = '/login';
            }
        }

        async function loadMessages() {
            try {
                const response = await fetch('/api/messages', {
                    credentials: 'same-origin' // Important for sending cookies
                });
                
                if (response.status === 401) {
                    window.location.href = '/login?error=session_expired';
                    return;
                }
                
                if (!response.ok) {
                    throw new Error('Erro ao carregar mensagens');
                }
                
                const messages = await response.json();
                const messagesDiv = document.getElementById('messages');
                messagesDiv.innerHTML = '';
                
                messages.forEach(msg => {
                    const div = document.createElement('div');
                    div.className = `message ${msg.recebido ? 'received' : 'sent'}`;
                    div.textContent = msg.texto;
                    messagesDiv.appendChild(div);
                });
                
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            } catch (error) {
                console.error('Erro:', error);
            }
        }

        document.getElementById('messageForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!await checkSession()) {
                return;
            }

            const input = document.getElementById('messageInput');
            const texto = input.value.trim();
            
            if (!texto) return;
            
            try {
                const response = await fetch('/api/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'same-origin', // Important for sending cookies
                    body: JSON.stringify({ texto })
                });
                
                if (response.status === 401) {
                    window.location.href = '/login?error=session_expired';
                    return;
                }
                
                if (!response.ok) {
                    throw new Error('Erro ao enviar mensagem');
                }
                
                input.value = '';
                await loadMessages();
            } catch (error) {
                console.error('Erro:', error);
            }
        });

        // Initial session check and load messages
        (async function init() {
            if (await checkSession()) {
                loadMessages();
                // Set up periodic session checks
                setInterval(checkSession, 60000); // Check session every minute
                // Set up periodic message updates
                setInterval(loadMessages, 5000); // Update messages every 5 seconds
            }
        })();
    </script>
</body>
</html>
