[package]
name = "psocial3"
version = "0.1.0"
edition = "2021"

[dependencies]
poem = { version = "3.1.8", features = ["websocket"] }
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonwebtoken = "9.2.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1.0"